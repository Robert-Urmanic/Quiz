# Render Blueprint. Deliberately no `databases:` block here - Render deletes a
# free Postgres instance after 30 days, which already cost this project its
# data once. The database lives at an external provider whose free tier does
# not expire (Neon), and only its connection string is handed in.
services:
  - type: web
    name: javaquiz
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /json
    envVars:
      # sync: false means Render asks for the value once in the dashboard and
      # keeps it there, so the credentials never enter this repository.
      # HibernateUtil translates it into a JDBC url plus username and password.
      - key: DATABASE_URL
        sync: false
