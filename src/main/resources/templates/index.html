<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
</head>
<body>

<h1>My page</h1>
<select id="chapterSelect" name="chapterId">
    <option value="">-- Choose chapter --</option>

    <option th:each="chapter : ${chapters}"
            th:value="${chapter.id}"
            th:text="${chapter.name}">
    </option>
</select>

<select id="subchapterSelect" name="subchapterId">
    <option value="">-- Choose subchapter --</option>
</select>

<hr>

<!-- ADD CHAPTER -->
<div>
    <input type="text" id="chapterName" placeholder="New chapter name">
    <button onclick="addChapter()">Add Chapter</button>
</div>

<br>

<!-- ADD SUBCHAPTER -->
<div>
    <input type="text" id="subchapterName" placeholder="New subchapter name">
    <button onclick="addSubchapter()">Add Subchapter</button>
</div>

<br>

<!-- ADD QUESTION -->
<div>
    <input type="text" id="questionText" placeholder="New question">
    <button onclick="addQuestion()">Add Question</button>
</div>

<script>
    const chapterSelect = document.getElementById("chapterSelect");
    const subchapterSelect = document.getElementById("subchapterSelect");

    chapterSelect.addEventListener("change", async function () {
        const chapterId = this.value;

        subchapterSelect.innerHTML = '<option value="">-- Choose subchapter --</option>';

        if (!chapterId) {
            return;
        }

        const response = await fetch(`/subchapters?chapterId=${chapterId}`);
        const subchapters = await response.json();

        subchapters.forEach(subchapter => {
            const option = document.createElement("option");
            option.value = subchapter.id;
            option.textContent = subchapter.name;
            subchapterSelect.appendChild(option);
        });
    });

    async function addChapter() {

    const name = document.getElementById("chapterName").value;

    await fetch("/addChapter", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name
        })
    });

    alert("Chapter added");
}

async function addSubchapter() {

    const name = document.getElementById("subchapterName").value;
    const chapterId = document.getElementById("chapterSelect").value;

    await fetch("/addSubchapter", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            chapterId: chapterId
        })
    });

    alert("Subchapter added");
}

async function addQuestion() {

    const text          = document.getElementById("questionText").value;
    const subchapterId  = document.getElementById("subchapterSelect").value;
    const chapterId     = document.getElementById("chapterSelect").value;

    await fetch("/addQuestion", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: text,
            subchapterId: subchapterId,
            chapterId: chapterId
        })
    });

    alert("Question added");
}
</script>
</body>
</html>
